  /* Matrix palette: black, glowing green, white-hot highlights, amber mistakes */
  :root {
    --bg: #000000;        /* page background */
    --sub-alt: #071407;   /* panels, keys, controls */
    --sub: #1f7a33;       /* labels and secondary text */
    --text: #39d353;      /* general text and controls */
    --main: #00ff41;      /* numbers, accents, buttons */
    --ink: #b9ffc9;       /* text still to type */
    --done: #1d6b33;      /* text already typed */
    --hot: #eaffef;       /* white-hot: caret, next key, letters that have met the target */
    --caret: #00ff41;     /* title and outlines */
    --err: #ffb000;       /* mistakes: amber, the classic terminal warning colour */
    --glow: rgba(0, 255, 65, .55);
    --font: "Source Code Pro", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    justify-content: center;
    padding: 5vh 20px 20px;
  }
  main { width: 100%; max-width: 860px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; margin: 0 0 22px; }
  .level { display: flex; align-items: center; gap: 12px; font-size: .72rem; color: var(--sub); cursor: default; }
  .level b { color: var(--main); font-weight: 600; }
  .lvbar { width: 70px; height: 4px; border-radius: 2px; background: var(--sub-alt); overflow: hidden; }
  .lvbar i { display: block; height: 100%; width: 0; background: var(--main); box-shadow: 0 0 6px var(--glow); transition: width .4s ease-out; }
  h1 { font-size: 1.35rem; font-weight: 600; margin: 0; color: var(--caret); letter-spacing: .02em; text-shadow: 0 0 8px var(--glow); }

  /* controls bar */
  .setup { font-size: .78rem; display: flex; gap: 8px 18px; align-items: center; justify-content: center; flex-wrap: wrap;
    width: fit-content; max-width: 100%; margin: 0 auto 8px; background: var(--sub-alt); border-radius: 8px; padding: 6px 14px; color: var(--sub); }
  .setup .opt { display: flex; align-items: center; gap: 7px; }
  select, input, button { font: inherit; color: var(--text); }
  select { padding: 4px 6px; border-radius: 6px; border: 0; background: var(--bg); color: var(--main); cursor: pointer; }
  #letters {
    font: 600 1.05rem var(--font);
    letter-spacing: 0.35em;
    width: calc(4ch + 1.75em + 22px);
    padding: 4px 8px 4px calc(8px + 0.35em);
    border: 0; border-radius: 6px;
    background: var(--bg); color: var(--main);
    text-transform: lowercase;
  }
  #letters::placeholder { color: var(--sub); opacity: .6; }
  #letters:focus { outline: 1px solid var(--sub); }
  button { padding: 4px 12px; border-radius: 6px; border: 0; background: var(--bg); color: var(--sub); cursor: pointer; transition: color .15s, background .15s; }
  button:hover { color: var(--bg); background: var(--main); }
  button:focus-visible, select:focus-visible { outline: 1px solid var(--main); outline-offset: 2px; }
  .best b { color: var(--main); font-weight: 600; margin: 0 2px; text-shadow: 0 0 6px var(--glow); }
  .best.new b { animation: bestflash 1.6s ease-out; }
  @keyframes bestflash { 0%, 30% { color: var(--bg); background: var(--main); border-radius: 4px; } 100% { background: transparent; } }
  .best button { padding: 1px 6px; font-size: .68rem; background: transparent; color: var(--sub); }
  .best button:hover { background: var(--bg); color: var(--main); }
  #customCtl { display: contents; }
  input[type="checkbox"] { accent-color: var(--main); margin: 0; }
  #customCtl[hidden] { display: none; }
  #msg { text-align: center; min-height: 1.4em; color: var(--err); margin: 0 0 14px; font-size: .8rem; }
  #msg.good { color: var(--main); }
  .meaning { text-align: center; margin: 6px 0 0; min-height: 1.6em; font-size: 1.05rem; color: var(--ink); text-shadow: 0 0 6px var(--glow); }
  .meaning[hidden] { display: block; visibility: hidden; }     /* keeps its space so the page doesn't jump */
  .meaning b { color: var(--hot); font-weight: 600; }

  /* progressive ladder */
  .prog { margin: 0 0 26px; text-align: center; }
  .prog[hidden] { display: none; }
  .chips { display: grid; grid-template-columns: repeat(26, minmax(20px, 1fr)); gap: 4px; overflow-x: auto; padding-bottom: 7px; }
  .chip { position: relative; border-radius: 5px; padding: 3px 0; font-size: .8rem; line-height: 1.3; background: var(--sub-alt); color: var(--sub); opacity: .45; }
  .chip.on { opacity: 1; color: var(--main); }
  .chip.met { background: var(--hot); color: var(--bg); font-weight: 600; box-shadow: 0 0 10px var(--glow); }
  .chip.next { opacity: 1; background: transparent; box-shadow: inset 0 0 0 1px var(--sub); }
  .chip.new::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--caret); }
  .progctl { display: flex; justify-content: center; align-items: center; gap: 6px 16px; flex-wrap: wrap; margin-top: 10px; font-size: .72rem; color: var(--sub); }
  .progctl input { width: 4.2em; padding: 2px 6px; border: 0; border-radius: 5px; background: var(--sub-alt); color: var(--main); text-align: center; }

  /* typing text: straight on the background, no box */
  #text {
    position: relative;
    padding: 6px 0 4px;
    font: 1.6rem/2.4rem var(--font);
    white-space: pre-wrap;
    text-align: center;
    word-break: normal;
    overflow-wrap: normal;
    user-select: none;
    cursor: text;
    min-height: 7.4rem;
    outline: none;
  }
  #text span { color: var(--ink); text-shadow: 0 0 8px var(--glow); }   /* still to type: bright, glowing */
  #text span.ok { color: var(--done); text-shadow: none; }               /* typed correctly: dulled */
  #text span.bad { color: var(--err); text-shadow: 0 0 8px rgba(255, 176, 0, .7); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
  /* gliding caret: one element that slides to the next letter, white-hot like the head of a stream of code */
  .caret { position: absolute; left: 0; top: 0; width: 2px; height: 1.8rem; border-radius: 1px; background: var(--hot); box-shadow: 0 0 10px #fff, 0 0 18px var(--main);
    pointer-events: none; will-change: transform; transition: transform .1s ease-out, opacity .15s; }
  .caret.jump { transition: none; }
  .caret.hide { opacity: 0; }
  .caret.blink { animation: caretblink 1s steps(1) infinite; }      /* test finished: wait for Tab */
  @keyframes caretblink { 50% { opacity: 0; } }

  .stats { display: flex; justify-content: center; gap: 30px; margin-top: 22px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .stats div { color: var(--sub); font-size: .8rem; }
  .stats b { color: var(--main); font-size: 1.35rem; font-weight: 600; margin-right: 4px; text-shadow: 0 0 6px var(--glow); }
  .hint { text-align: center; margin-top: 48px; line-height: 2; color: var(--sub); font-size: .72rem; }
  kbd { font: .68rem var(--font); padding: 1px 6px; border-radius: 4px; background: var(--sub); color: var(--bg); }

  /* on-screen keyboard (Russian): next key highlighted, locked letters dimmed */
  .vkb { width: fit-content; max-width: 100%; margin: 30px auto 0; display: flex; flex-direction: column; gap: 5px; overflow-x: auto; }
  .vkb[hidden] { display: none; }
  .vrow { display: flex; gap: 5px; }
  .vk { position: relative; width: 36px; height: 36px; border-radius: 6px; background: var(--sub-alt); color: var(--text);
    display: flex; align-items: center; justify-content: center; font-size: .9rem; transition: background .08s, color .08s; }
  .vk.dim { color: var(--sub); opacity: .4; }
  .vk.next { background: var(--hot); color: var(--bg); opacity: 1; font-weight: 600; box-shadow: 0 0 12px var(--main); }
  .vk.bump::after { content: ""; position: absolute; bottom: 5px; width: 9px; height: 2px; border-radius: 1px; background: currentColor; opacity: .6; }
  .vk.space { width: 230px; }
  .vk.shift { width: 45px; font-size: .62rem; }
  .vk.shift.right { width: 82px; }

  /* key statistics */
  .keypanel h2 { font-size: .72rem; font-weight: 400; color: var(--sub); margin: 0 0 10px; }
  .keypanel { width: fit-content; max-width: 100%; margin: 48px auto 0; text-align: center; }
  .pair { display: flex; justify-content: center; gap: 12px 34px; flex-wrap: wrap; }
  .group { width: 244px; max-width: 100%; }
  .keys { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .keycard { width: 56px; padding: 5px 4px 6px; border-radius: 7px; background: var(--sub-alt); }
  .keycard:first-child { box-shadow: inset 0 0 0 1px var(--caret); }
  .keycard .rank { font-size: .6rem; color: var(--sub); }
  .keycard .key { font-size: 1.05rem; line-height: 1.25; color: var(--main); }
  .keycard .ms { font-size: .62rem; color: var(--sub); font-variant-numeric: tabular-nums; }
  .keys .empty { font-size: .7rem; color: var(--sub); opacity: .8; }
  .actions { text-align: center; margin-top: 10px; }
  button.quiet { background: transparent; color: var(--sub); padding: 3px 10px; font-size: .72rem; }
  button.quiet:hover { background: var(--sub-alt); color: var(--main); }

  /* intro screen: digital rain, a pause, a typed greeting, then Enter into the app (once per session) */
  html.intro-on, html.intro-on body { overflow: hidden; }
  #intro { position: fixed; inset: 0; z-index: 100; background: var(--bg); transition: opacity .5s ease; }
  #intro.out { opacity: 0; pointer-events: none; }
  #introRain { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #introHalo { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.2s ease;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, .55) 0%, rgba(0, 0, 0, .45) 40%, rgba(0, 0, 0, 0) 75%); }
  #introHalo.on { opacity: 1; }
  #introStage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 16px; cursor: default; }
  #introGreet { display: flex; align-items: center; max-width: 100%; white-space: pre; font: 600 clamp(20px, 4.2vw, 46px) var(--font);
    letter-spacing: .02em; color: var(--hot); text-shadow: 0 0 6px var(--glow), 0 0 22px var(--glow); }
  #introCaret { display: inline-block; width: .55em; height: 1em; margin-left: .08em; background: var(--hot); box-shadow: 0 0 10px var(--glow); opacity: 0; }
  #introCaret.on { opacity: 1; }
  #introCaret.blink { animation: caretblink 1.06s steps(1) infinite; }
  #introHint { position: absolute; left: 0; right: 0; bottom: 28px; margin: 0; text-align: center; font-size: .8rem; letter-spacing: .18em;
    text-transform: uppercase; color: var(--sub); opacity: 0; transition: opacity .8s ease; }
  #introHint.on { opacity: 1; }
  #introHint kbd { font-size: .78rem; letter-spacing: .08em; background: transparent; color: var(--main); border: 1px solid var(--sub); padding: 1px 7px; }
  #introSkip { position: absolute; top: 10px; right: 12px; padding: 10px 14px; background: rgba(0, 0, 0, .8); border: 0; border-radius: 4px; color: var(--sub);
    font: .7rem var(--font); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
  #introSkip:hover, #introSkip:focus-visible { color: var(--main); }
</style>
</head>
<body>
<div id="intro" role="dialog" aria-label="Welcome">
  <canvas id="introRain" aria-hidden="true"></canvas>
  <div id="introHalo"></div>
  <div id="introStage"><div id="introGreet"><span id="introText"></span><span id="introCaret"></span></div></div>
  <p id="introHint">Press <kbd>Enter</kbd> to jack in</p>
  <button id="introSkip" type="button" tabindex="-1">Skip</button>
</div>
<script>
// Intro screen. Shown once per browser session; Enter, Escape, Skip or a click goes straight to the app.
// While it is up it takes every key, so nothing reaches the typing test behind it.
(function () {
  var intro = document.getElementById("intro");
  var seen = false;
  try { seen = sessionStorage.getItem("tv.intro.seen") === "1"; } catch (e) {}
  if (seen) { intro.remove(); return; }
  document.documentElement.classList.add("intro-on");

  var MSG = "Welcome to the Construct";
  var GLYPHS = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789Z:.=*+-<>¦";
  var cv = document.getElementById("introRain"), ctx = cv.getContext("2d");
  var textEl = document.getElementById("introText"), caret = document.getElementById("introCaret");
  var hint = document.getElementById("introHint"), halo = document.getElementById("introHalo");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W, H, size, cols, drops, speed, raf = 0, last = 0, dim = 0, dimTarget = 0, timers = [], active = true, ready = false;

  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    size = W < 500 ? 14 : 18; cols = Math.ceil(W / size);
    drops = []; speed = [];
    for (var i = 0; i < cols; i++) { drops.push(Math.random() * -H / size); speed.push(.35 + Math.random() * .65); }
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  }
  function frame(t) {
    raf = requestAnimationFrame(frame);
    if (t - last < 33) return;             // about 30 frames a second, the classic look
    last = t;
    dim += (dimTarget - dim) * .05;
    ctx.fillStyle = "rgba(0,0,0," + (.08 + dim * .12) + ")"; ctx.fillRect(0, 0, W, H);
    ctx.font = "600 " + size + "px " + getComputedStyle(document.body).fontFamily;
    for (var i = 0; i < cols; i++) {
      var x = i * size, y = drops[i] * size;
      ctx.fillStyle = "rgba(0,255,65," + Math.max(0, .85 - dim * .6) + ")";
      ctx.fillText(GLYPHS[Math.random() * GLYPHS.length | 0], x, y - size);
      ctx.fillStyle = "rgba(234,255,239," + Math.max(0, 1 - dim * .6) + ")";   // white-hot head of each stream
      ctx.fillText(GLYPHS[Math.random() * GLYPHS.length | 0], x, y);
      drops[i] += speed[i];
      if (y > H && Math.random() > .975) drops[i] = Math.random() * -20;
    }
  }
  function type(i) {
    if (i > MSG.length) { caret.className = "on blink"; later(function () { hint.classList.add("on"); }, 700); ready = true; return; }
    textEl.textContent = MSG.slice(0, i);
    later(function () { type(i + 1); }, MSG[i - 1] === " " ? 150 : 55 + Math.random() * 95);
  }
  function start() {
    if (!active) return;
    resize();
    if (reduce) {                          // no moving rain or typing: show the finished greeting
      textEl.textContent = MSG; caret.className = "on"; hint.classList.add("on"); ready = true; return;
    }
    raf = requestAnimationFrame(frame);
    later(function () { dimTarget = 1; halo.classList.add("on"); }, 2600);   // the rain recedes
    later(function () { caret.className = "on blink"; }, 3300);              // the caret waits
    later(function () { caret.className = "on"; type(1); }, 4400);           // a brief pause, then the greeting
  }
  function enter() {
    if (!active) return;
    active = false;
    timers.forEach(clearTimeout); timers = [];
    try { sessionStorage.setItem("tv.intro.seen", "1"); } catch (e) {}
    intro.classList.add("out");
    document.documentElement.classList.remove("intro-on");
    setTimeout(function () { cancelAnimationFrame(raf); intro.remove(); }, 550);
  }
  // capture phase on window runs before the app's own key handler, so the test behind sees nothing
  window.addEventListener("keydown", function (e) {
    if (!active) return;
    e.stopImmediatePropagation();
    if (e.ctrlKey || e.metaKey || /^F\d+$/.test(e.key)) return;    // leave browser shortcuts alone
    e.preventDefault();
    if (e.key === "Enter" || e.key === "Escape") enter();
  }, true);
  intro.addEventListener("click", function (e) { if (ready || e.target.id === "introSkip") enter(); });
  window.addEventListener("resize", function () { if (active) resize(); });
  window.addEventListener("load", start);
})();
</script>
<main>
  <header class="top">
    <h1>Terminal Velocity</h1>
    <div class="level" id="levelBox">
      <span>Level <b id="lvl">1</b></span>
      <span class="lvbar" aria-hidden="true"><i id="lvlBar"></i></span>
      <span><b id="lvlTests">0</b> <span id="lvlTestsWord">tests</span></span>
      <span><b id="lvlTime">0m</b> typed</span>
    </div>
  </header>

  <div class="setup">
    <label class="opt">Mode
      <select id="mode">
        <option value="prog">Progressive</option>
        <option value="custom">Custom letters</option>
        <option value="word" id="wordOpt">Random word</option>
      </select>
    </label>
    <span id="customCtl" hidden>
      <label for="letters">Letters</label>
      <input id="letters" maxlength="4" autocomplete="off" spellcheck="false" placeholder="etao">
      <button id="set" type="button">Set letters</button>
      <label class="opt" title="Letter drills that practise every letter and pair evenly, instead of words">
        <input type="checkbox" id="drills"> Drills</label>
    </span>
    <label class="opt" title="Next language: Alt + L">Language
      <select id="lang">
        <option value="en">English</option>
        <option value="uk" lang="uk">Українська</option>
        <option value="ru" lang="ru">Русский</option>
      </select>
    </label>
    <label class="opt" title="Add capital letters and punctuation marks to the text, in any mode">
      <input type="checkbox" id="punct"> Punctuation</label>
    <label class="opt" title="QWERTY or ЙЦУКЕН: your keys are read as that layout, so you don't need to install it. System: uses whatever your computer's keyboard layout types.">Keyboard
      <select id="layout">
        <option value="qwerty" id="stdOpt" selected>QWERTY</option>
        <option value="system">System</option>
      </select>
    </label>
    <span class="opt best" id="bestBox" title="Fastest speed across all finished tests">Best <b id="best">–</b> wpm
      <button id="resetBest" type="button" title="Reset best speed" aria-label="Reset best speed">reset</button>
    </span>
  </div>
  <p id="msg" role="status"></p>

  <section class="prog" id="progPanel" aria-label="Progressive letters, in order of English frequency" hidden>
    <div class="chips" id="chips"></div>
    <div class="progctl">
      <label title="Each language keeps its own target speed">Target speed <input id="target" type="number" min="5" max="200" step="1"> wpm</label>
      <button id="resetProg" class="quiet" type="button">Restart from 6 letters</button>
    </div>
  </section>

  <div id="text" tabindex="-1" aria-live="off"></div>
  <p class="meaning" id="meaning" role="status" hidden></p>

  <div class="stats">
    <div><b id="time">0</b>s</div>
    <div><b id="wpm">0</b>wpm</div>
    <div><b id="acc">100</b>% accuracy</div>
    <div><b id="errs">0</b>errors</div>
    <div><b id="prog">0</b>% done</div>
  </div>

  <div class="vkb" id="vkb" hidden aria-hidden="true"></div>

  <section class="keypanel" aria-label="Weakest keys, all tests">
    <div class="pair">
      <div class="group">
        <h2 id="slowTitle">Slowest four keys</h2>
        <div class="keys" id="slowKeys" aria-labelledby="slowTitle"></div>
      </div>
      <div class="group">
        <h2 id="inaccTitle">Least accurate four keys</h2>
        <div class="keys" id="inaccKeys" aria-labelledby="inaccTitle"></div>
      </div>
    </div>
  </section>

  <p class="hint"><kbd>Tab</kbd> new text &nbsp; <kbd>Backspace</kbd> fix a mistake &nbsp; <kbd>Ctrl</kbd> + <kbd>Backspace</kbd> delete a word &nbsp; <kbd>Alt</kbd> + <kbd>L</kbd> next language</p>

  <div class="actions">
    <button id="clear" class="quiet" type="button">Clear key history</button>
    <button id="exportBtn" class="quiet" type="button" title="Save your progress, levels and statistics for every language to a file">Export progress</button>
    <button id="importBtn" class="quiet" type="button" title="Load progress from a file saved with Export progress">Import progress</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</main>

        e.preventDefault();
        var s = input.selectionStart, t = input.selectionEnd;
        if (input.value.length - (t - s) + 1 <= 4) input.setRangeText(kc, s, t, "end");
      }
      return;
    }
    if (/^(SELECT|BUTTON)$/.test(e.target.tagName)) return;

    // Ctrl+Backspace: go back to the start of the word (or the previous word if already at a word start)
    if (e.key === "Backspace" && (e.ctrlKey || e.altKey) && text && !finished) {
      e.preventDefault();
      var from = typed.length, i = from;
      while (i > 0 && text[i - 1] === " ") i--;
      while (i > 0 && text[i - 1] !== " ") i--;
      typed.length = i;
      moved(i, from);
      prevT = null;                   // the retyped key isn't timed
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey || !text || finished) return;

    if (e.key === "Backspace") {
      e.preventDefault();
      if (typed.length) { typed.pop(); moved(typed.length); }
      prevT = null;                 // the retyped key after a correction isn't timed
      return;
    }
    var ch = charFor(e);
    if (ch.length !== 1) return;
    e.preventDefault();
    if (layoutSel.value !== "qwerty" && !hinted) {   // the computer is typing the other language's letters
      var lc = ch.toLowerCase(), other = null;
      if (L().alphabet.indexOf(lc) < 0) LANG_ORDER.forEach(function (id) {
        if (!other && id !== store.prog.lang && LANGS[id].alphabet.indexOf(lc) >= 0) other = LANGS[id];
      });
      if (other) {
        hinted = true;
        msg.className = "";
        msg.textContent = "Your keyboard is typing " + other.name + " letters. Switch Language to " +
          other.native + ", or set Keyboard to " + L().std + ".";
      }
    }
    if (typed.length >= text.length) return;

    if (!startTime) {
      startTime = Date.now();
      timer = setInterval(updateStats, TICK_MS);
    }
    var t = Date.now() - startTime;
    var expected = text[typed.length];
    var ok = ch === expected;
    keystrokes++;
    if (!ok) mistakes++;
    if (L().alphabet.indexOf(expected) >= 0) {
      var ks = testKeys[expected] || (testKeys[expected] = { time: 0, n: 0, ok: 0, err: 0, g: [], o: [] });
      ks.o.push(ok ? 1 : 0);
      if (!ok) ks.err++;
      else {
        ks.ok++;
        if (prevT !== null) { ks.time += t - prevT; ks.n++; ks.g.push(t - prevT); }
      }
    }
    prevT = t;
    typed.push(ch);
    moved(typed.length);
    updateStats();
    // the test ends once the last character is typed correctly; a wrong last character can be fixed
    if (typed.length >= text.length && ok) finish();
  });

  window.addEventListener("resize", function () { placeCaret(false); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { inkCache = null; placeCaret(false); });

  renderKeys();
  renderBest(false);
  renderLevel();
  applyMode();
  if (letters.length) newText(); else { render(); input.focus(); }
})();
</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js");
</script>
